name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Forbidden install settings
        run: npm run check:install-flags
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=info
      - name: Lint, comments and architecture
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Tests with coverage thresholds
        run: npm test
      - name: Build
        run: npm run build
      - name: Check for the SonarQube Cloud token
        id: sonar-token
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SonarQube Cloud analysis and quality gate
        if: steps.sonar-token.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the repository history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: Confirm the scanner catches a leaked key
        run: |
          if docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo/tools/lint/fixtures/secrets --no-banner --redact; then
            echo "gitleaks did not detect the fixture secret"
            exit 1
          fi
